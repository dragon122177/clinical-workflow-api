services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: careflow
      POSTGRES_PASSWORD: careflow
      POSTGRES_DB: careflow
    ports: ["5432:5432"]
    volumes: ["careflow_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careflow"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  careflow_data:
